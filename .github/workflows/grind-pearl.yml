name: grind-pearl
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "puzzleSeed hex (64 char, tanpa 0x)"
        required: true
        type: string
      target:
        description: "Leading zero bits (stage 0 = 30)"
        required: true
        default: "30"
        type: string
      shards:
        description: "Parallel shards (1-20)"
        required: true
        default: "20"
        type: string
      minutes:
        description: "Per-shard time budget in minutes"
        required: true
        default: "55"
        type: string
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          n = max(1, min(20, int("${{ inputs.shards }}")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"shard": list(range(n))}) + "\n")
              f.write("count=" + str(n) + "\n")
          PY
  grind:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build grinder
        run: gcc -O3 -pthread -o pearl grinder/pearl_gh.c
      - name: Grind shard ${{ matrix.shard }}
        env:
          SEED: ${{ inputs.seed }}
          TARGET: ${{ inputs.target }}
          MINUTES: ${{ inputs.minutes }}
          SHARDS: ${{ needs.plan.outputs.count }}
          SHARD: ${{ matrix.shard }}
        run: |
          START=$(( SHARD * 4 ))
          STEP=$(( SHARDS * 4 ))
          SECS=$(( MINUTES * 60 ))
          echo "shard $SHARD/$SHARDS start=$START step=$STEP cap=${SECS}s"
          timeout "${MINUTES}m" ./pearl "$SEED" grind "$TARGET" 4 $START $STEP $SECS > found.txt || true
          cat found.txt || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pearl-${{ matrix.shard }}
          path: found.txt
          if-no-files-found: ignore
