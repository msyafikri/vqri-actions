name: grind
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "String prefix ending in ':' — nonce is appended"
        required: true
        type: string
      bits:
        description: "Leading zero bits required"
        required: true
        default: "35"
        type: string
      shards:
        description: "Parallel shards (1-20)"
        required: true
        default: "20"
        type: string
      minutes:
        description: "Per-shard time budget in minutes"
        required: true
        default: "55"
        type: string
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          n = max(1, min(20, int("${{ inputs.shards }}")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"shard": list(range(n))}) + "\n")
              f.write("count=" + str(n) + "\n")
          PY
  grind:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build grinder
        run: gcc -O3 -pthread -o tail grinder/tail_gh.c
      - name: Grind shard ${{ matrix.shard }}
        env:
          PREFIX: ${{ inputs.prefix }}
          BITS: ${{ inputs.bits }}
          MINUTES: ${{ inputs.minutes }}
          SHARDS: ${{ needs.plan.outputs.count }}
          SHARD: ${{ matrix.shard }}
        run: |
          START=$(( SHARD * 4 ))
          STEP=$(( SHARDS * 4 ))
          echo "shard $SHARD/$SHARDS start=$START step=$STEP"
          timeout "${MINUTES}m" ./tail "$PREFIX" "$BITS" 4 $START $STEP > result.json || true
          cat result.json || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grind-${{ matrix.shard }}
          path: result.json
          if-no-files-found: ignore
