name: grind-amnt
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "sessionSeedBase hex (64 char, tanpa 0x)"
        required: true
        type: string
      day:
        description: "dayIndex musim AMNT"
        required: true
        default: "0"
        type: string
      lane:
        description: "Lane mining (2 = CPU 28-bit, 1 = GPU)"
        required: true
        default: "2"
        type: string
      target:
        description: "Target uint256 desimal (lane 2: 431359146674410236714672241392314090778194310760649159697657763987455)"
        required: true
        default: "431359146674410236714672241392314090778194310760649159697657763987455"
        type: string
      jobs:
        description: "Parallel jobs (1-20)"
        required: true
        default: "8"
        type: string
      seconds:
        description: "Per-job time budget in seconds"
        required: true
        default: "120"
        type: string
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          n = max(1, min(20, int("${{ inputs.jobs }}")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"shard": list(range(n))}) + "\n")
              f.write("count=" + str(n) + "\n")
          PY
  grind:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build grinder
        run: gcc -O3 -pthread -o amnt grinder/amnt_gh.c
      - name: Grind shard ${{ matrix.shard }}
        env:
          SEED: ${{ inputs.seed }}
          DAY: ${{ inputs.day }}
          LANE: ${{ inputs.lane }}
          TARGET: ${{ inputs.target }}
          SECONDS: ${{ inputs.seconds }}
          JOBS: ${{ needs.plan.outputs.count }}
          SHARD: ${{ matrix.shard }}
        run: |
          START=$(( SHARD * 4 ))
          STEP=$(( JOBS * 4 ))
          echo "shard $SHARD/$JOBS start=$START step=$STEP cap=${SECONDS}s day=$DAY lane=$LANE"
          timeout "$((SECONDS + 30))s" ./amnt "$SEED" grind "$DAY" "$LANE" "$TARGET" 4 $START $STEP $SECONDS > found.txt || true
          cat found.txt || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amnt-${{ matrix.shard }}
          path: found.txt
          if-no-files-found: ignore
