name: grind-chip404
on:
  workflow_dispatch:
    inputs:
      bits:
        description: "Target leading zero bits (record every hit >= this)"
        required: true
        default: "40"
        type: string
      shards:
        description: "Parallel shards (1-20)"
        required: true
        default: "20"
        type: string
      minutes:
        description: "Per-shard grind budget in minutes"
        required: true
        default: "55"
        type: string
      wave:
        description: "Wave number (nonce-space partition)"
        required: true
        default: "1"
        type: string
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          n = max(1, min(20, int("${{ inputs.shards }}")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"shard": list(range(n))}) + "\n")
              f.write("count=" + str(n) + "\n")
          PY
  grind:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build grinder
        run: gcc -O3 -march=native -pthread -o chip404 grinder/chip404_gh.c
      - name: Grind shard ${{ matrix.shard }}
        env:
          BITS: ${{ inputs.bits }}
          MINUTES: ${{ inputs.minutes }}
          WAVE: ${{ inputs.wave }}
          SHARD: ${{ matrix.shard }}
        run: |
          START=$(( ( (WAVE - 1) * 20 + SHARD ) * 4398046511104 ))
          SECONDS=$(( MINUTES * 60 ))
          echo "shard $SHARD wave $WAVE start=$START bits=$BITS seconds=$SECONDS"
          timeout "${MINUTES}m" ./chip404 "$START" "$BITS" result_hits.txt 4 "$SECONDS" > result.txt || true
          cat result.txt || true
          echo "--- hits ---"
          cat result_hits.txt || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip404-w${{ inputs.wave }}-${{ matrix.shard }}
          path: |
            result.txt
            result_hits.txt
          if-no-files-found: ignore
